[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzum"
version = "2026.07.28"
authors = [
  { name="Rob Pellegrin", email="none@none.com" },
]
description = "A fuzzy file finder"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://gitlab.robpellegrin.com/robpellegrin/fuzzum"
Issues = "https://gitlab.robpellegrin.com/robpellegrin/fuzzum/issues"

[project.scripts]
fuzz = "fuzzum:main.cli"

[tool.black]
line-length = 79

[tool.pylint]
disable = ["missing-class-docstring", "missing-function-docstring"]

[tool.mypy]
files = ["src"]
mypy_path = ["src"]
explicit_package_bases = true

# Enable strict type checking (enforces more thorough type checks).
strict = true

# Ensure that functions and methods have type hints.
disallow_untyped_calls = true
disallow_untyped_defs = true

# Prevent functions from returning without type hints.
disallow_incomplete_defs = true

# Ensure that no untyped variables are used.
check_untyped_defs = true

# Ignore missing imports in type checks (useful if you have external libraries)
# If you have missing modules (e.g., circular imports), this will prevent errors.
# If you want mypy to flag missing imports, set this to false.
ignore_missing_imports = true

# If you are using forward references, this helps resolve them correctly
# (recommended if using string-based type hints for forward references).
disallow_untyped_decorators = true

# Show warnings for unused 'type: ignore' comments, if present.
warn_unused_ignores = true

# Use this if you want to specify additional directories for type-checking.
# This could be useful if your project has custom or third-party dependencies.
# you might want to add `venv` or `env` folders here if they exist
# exclude = ["venv", "__pycache__", "env"]
